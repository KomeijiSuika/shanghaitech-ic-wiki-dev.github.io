site_name: 上科大芯知库
site_description: 上海科技大学学生发起的集成电路知识社区 ShanghaiTech IC Wiki，收录学习路线、校内资源和工程实践经验。
site_url: !ENV [SITE_URL, 'https://shanghaitech-ic-wiki-dev.github.io/']
repo_url: !ENV [REPO_URL, 'https://github.com/ShanghaiTech-IC-Wiki-Dev/shanghaitech-ic-wiki-dev.github.io']
repo_name: GitHub
edit_uri: edit/main/docs/
copyright: 上科大芯知库 · ShanghaiTech IC Wiki

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/book-open-page-variant-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: [zh, en]

hooks:
  - hooks/wiki.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 此节的永久链接
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/wiki.css

validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

nav:
  - 首页: index.md
  - 认识 IC:
      - explore-ic/index.md
      - explore-ic/knowledge-map.md
      - explore-ic/research-directions/index.md
  - 学习地图:
      - learning/index.md
      - learning/fundamentals/index.md
      - 专业方向:
          - learning/directions/index.md
          - learning/devices-and-process/index.md
          - 电路:
              - learning/circuits/index.md
              - learning/analog-ic/index.md
              - learning/digital-ic/index.md
          - 系统架构:
              - learning/computer-architecture/index.md
              - learning/computer-architecture/general-purpose-systems.md
              - learning/computer-architecture/heterogeneous-systems.md
          - 算法与编程:
              - learning/algorithms-and-programming/index.md
              - learning/algorithms-and-programming/languages-and-software-engineering.md
              - learning/algorithms-and-programming/algorithms-and-computation-theory.md
          - learning/eda/index.md
  - 上科大 IC:
      - shanghaitech/index.md
      - shanghaitech/courses/index.md
      - shanghaitech/honors-program/index.md
      - 本科生科研:
          - shanghaitech/faculty/index.md
          - shanghaitech/research-groups/index.md
  - 科研探索:
      - research/index.md
      - research/getting-started.md
      - research/paper-reading.md
  - 竞赛与项目:
      - competitions/index.md
      - competitions/competitions/index.md
      - competitions/experiences/index.md
      - competitions/projects/index.md
  - 升学与职业:
      - career/index.md
      - 升学:
          - career/graduate-study/index.md
          - career/study-abroad/index.md
      - 职业:
          - career/internship/index.md
          - career/employment/index.md
  - 工具与资源:
      - tools/index.md
      - tools/eda/index.md
      - tools/development/index.md
      - tools/open-source/index.md
  - 社区与共建:
      - community/index.md
      - community/contributing.md
      - community/writing.md
      - community/contributors.md
      - community/maintenance.md
